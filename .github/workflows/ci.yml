name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend (pytest + coverage + audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run pytest (with coverage)
        # 源码在 src/ 下且未安装为包，必须把 src 放进模块搜索路径，
        # 否则 `import deepquant` 失败（33 个收集错误）。
        # 用 env 而非 pytest.ini 的 pythonpath：部分用例会派生子进程
        # （如 test_deserialization_is_isolated_from_original_process），
        # 子进程只继承环境变量，不继承 pytest 的 pythonpath 配置。
        env:
          PYTHONPATH: src
        run: python -m pytest tests/ -q --tb=short --cov=deepquant --cov-report=term-missing
      - name: Dependency security scan (pip-audit, visibility only)
        # 安全扫描发现的 CVE 未必能在本 PR 修，不应阻塞合并；只做可见性。
        # 真实依赖变更（升级版本 / 换源）属判断类工作，交回 B 线处理。
        continue-on-error: true
        run: pip-audit -r requirements.txt --desc on

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
